; Afterburner Bridge - settings
;
; Lives next to AfterburnerBridge.dll in the plugin folder. Changes take
; effect when iCUE restarts: the sensor list is frozen at startup, because
; iCUE reads the count once and does not cope with it changing underneath.
;
; Delete this file and every default below applies.


[device]
; Name shown in iCUE.
name = Afterburner Bridge


[sensors]
; iCUE can only label five units: degrees, RPM, V, A and W.
;
; true  = publish everything, including entries whose unit iCUE cannot label
;         (%, MHz, MB, FPS...). See unit_in_name.
; false = publish only the entries iCUE labels correctly.
show_not_compatible = true


[display]
; 1 = append the real unit in brackets when iCUE cannot label it, so the
;     sensor reads "Framerate (FPS)".
unit_in_name = 1


[units]
; Which label iCUE puts on a unit it has none for. Only applies when
; show_not_compatible = true, and never to units iCUE already gets right.
;
; Key   = the unit exactly as Afterburner writes it. The log prints every
;         unit in square brackets, so copy the keys from there.
; Value = C, RPM, V, A or W, or the type names temperature, fan, pump,
;         voltage, current, power.
;
; Only the label changes, the number is correct either way. Careful with
; RPM: it brings the Cooling and Alerts pages with it.
;
; MHz = A
; FPS = C
; %   = A
; MB  = W


[log]
;Written to %TEMP%\AfterburnerBridge.log.
enabled = 1
